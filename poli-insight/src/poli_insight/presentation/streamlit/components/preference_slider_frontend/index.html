<section class="preference">
  <h4 class="question">Which criterion matters more to you?</h4>
  <p class="instruction">Choose a point, or drag along the scale.</p>
  <div class="criteria">
    <div class="criterion"><span class="eyebrow">Left criterion</span><strong class="left-name"></strong><p class="description left-description" hidden></p></div>
    <span class="balance" aria-hidden="true">⇄</span>
    <div class="criterion right"><span class="eyebrow">Right criterion</span><strong class="right-name"></strong><p class="description right-description" hidden></p></div>
  </div>
  <div class="directions" aria-hidden="true"><span>← Prefer left</span><span>Prefer right →</span></div>
  <div class="scale" role="radiogroup">
    <div class="rail" aria-hidden="true"><div class="fill"></div></div>
    <div class="stops"></div>
  </div>
  <div class="feedback">
    <span class="status-icon" aria-hidden="true">○</span>
    <p class="status" role="status" aria-live="polite" aria-atomic="true"></p>
    <button class="clear" type="button">Clear answer</button>
  </div>
  <p class="hint">Use arrow keys to move between choices. Select Equal to give both criteria the same importance.</p>
</section>
