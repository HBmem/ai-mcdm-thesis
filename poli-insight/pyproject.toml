[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poli-insight"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "streamlit[auth]>=1.58,<2",
    "streamlit-extras>=1.6,<2",
    "pydecision==5.1.1",
    "pandas",
    "numpy",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
