# PoliInsight — Streamlit Theme Configuration
# Two complete themes are provided below.
# Only ONE [theme] block can be active at a time.
# To switch themes: comment out the active block and uncomment the other.
 
# ──────────────────────────────────────────────
# LIGHT THEME  (default — policy paper aesthetic)
# ──────────────────────────────────────────────
[theme]
base                  = "light"
primaryColor          = "#C4932A"          # Gold — CTAs, active states, accents
backgroundColor       = "#F5F0E8"          # Warm paper — main page surface
secondaryBackgroundColor = "#EDE8DE"       # Slightly deeper paper — sidebar, cards
textColor             = "#1B2A4A"          # Deep navy — all body text
font                  = "serif"            # Matches scholarly Crimson Pro feel
baseFontSize          = 14
 
 
# ──────────────────────────────────────────────
# DARK THEME  (uncomment block below to activate)
# ──────────────────────────────────────────────
# [theme]
# base                     = "dark"
# primaryColor             = "#D4A843"       # Warmer gold for dark backgrounds
# backgroundColor          = "#0F1C32"       # Near-black navy — main surface
# secondaryBackgroundColor = "#1B2A4A"       # Mid navy — sidebar, cards
# textColor                = "#E8EDF5"       # Pale blue-white — all body text
# font                     = "serif"
 
 
# ──────────────────────────────────────────────
# SERVER / APP SETTINGS
# ──────────────────────────────────────────────
[server]
# headless      = true
# port          = 8501
 
[browser]
# gatherUsageStats = false
