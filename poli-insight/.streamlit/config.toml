# Native controls share the same palette as components/theme.py.
[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#F4F7FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#06152F"
font = "sans-serif"
headingFont = "sans-serif"
baseFontSize = 16
headingFontSizes = ["2.25rem", "1.5rem", "1.15rem", "1rem", "1rem", "1rem"]
headingFontWeights = [650, 600, 600, 600, 600, 600]
metricValueFontSize = "1.65rem"
baseRadius = "0.75rem"
buttonRadius = "0.5rem"
borderColor = "#D6DEE8"
dataframeBorderColor = "#D6DEE8"
dataframeHeaderBackgroundColor = "#EAF0F5"
showWidgetBorder = true
showSidebarBorder = true
linkColor = "#0F766E"

[theme.sidebar]
backgroundColor = "#EAF0F5"
secondaryBackgroundColor = "#FFFFFF"

# Explicit message colors keep small text above AA contrast thresholds.
[theme.light]
greenTextColor = "#126B2F"

[theme.dark]
primaryColor = "#0F766E"
backgroundColor = "#101B2D"
secondaryBackgroundColor = "#1B2A40"
textColor = "#E7EDF5"
blueTextColor = "#93C5FD"
borderColor = "#44546A"
dataframeBorderColor = "#44546A"
dataframeHeaderBackgroundColor = "#23344B"
linkColor = "#5EEAD4"

[theme.dark.sidebar]
backgroundColor = "#18263A"
secondaryBackgroundColor = "#1B2A40"
